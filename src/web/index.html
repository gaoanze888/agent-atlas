<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Atlas</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg2: #161822;
      --bg3: #1e2030;
      --border: #2a2d3e;
      --text: #e1e4ed;
      --text2: #8b8fa3;
      --gold: #f59e0b;
      --blue: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --orange: #f97316;
      --purple: #8b5cf6;
      --cyan: #06b6d4;
      --darkred: #991b1b;
      --gray: #6b7280;
      --yellow: #fbbf24;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    
    .app { display: flex; height: 100vh; flex-direction: column; }
    .topbar { display: flex; align-items: center; padding: 8px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); gap: 12px; }
    .topbar h1 { font-size: 16px; font-weight: 600; }
    .topbar h1 span { color: var(--blue); }
    .search-box { flex: 0 0 240px; padding: 4px 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 13px; }
    .filters { display: flex; gap: 6px; }
    .filter-btn { padding: 3px 8px; font-size: 12px; border: 1px solid var(--border); border-radius: 3px; background: transparent; color: var(--text2); cursor: pointer; }
    .filter-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .stats { margin-left: auto; display: flex; gap: 12px; font-size: 12px; color: var(--text2); }

    .main { display: flex; flex: 1; overflow: hidden; }
    
    /* Left: tree */
    .tree-panel { width: 280px; background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 8px 0; }
    .tree-node { display: flex; align-items: center; padding: 4px 12px; cursor: pointer; font-size: 13px; gap: 6px; }
    .tree-node:hover { background: var(--bg3); }
    .tree-node.selected { background: var(--bg3); border-left: 2px solid var(--blue); }
    .tree-node .icon { font-size: 14px; width: 20px; text-align: center; }
    .tree-node .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-node .dot { width: 6px; height: 6px; border-radius: 50%; }
    .tree-indent { display: inline-block; width: 16px; }
    
    /* Center: topology canvas */
    .canvas-panel { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
    .canvas-empty { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: var(--text2); }
    .canvas-empty h2 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
    
    /* SVG-based graph */
    .graph-svg { width: 100%; height: 100%; }
    .graph-node { cursor: pointer; }
    .graph-node rect { rx: 6; ry: 6; }
    .graph-node text { font-size: 12px; fill: var(--text); }
    .graph-node .node-icon { font-size: 14px; }
    
    /* Right: detail */
    .detail-panel { width: 320px; background: var(--bg2); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
    .detail-empty { color: var(--text2); font-size: 13px; padding-top: 40px; text-align: center; }
    .detail-type { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
    .detail-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .detail-status { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 500; }
    .detail-section { margin-top: 16px; }
    .detail-section h4 { font-size: 12px; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-section p { font-size: 13px; line-height: 1.5; }
    .detail-section .ev-item { font-size: 12px; padding: 4px 0; display: flex; gap: 6px; color: var(--text2); }
    .detail-section .ev-icon { font-size: 14px; }
    .detail-actions { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 6px; }
    .btn { padding: 5px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg3); color: var(--text); cursor: pointer; }
    .btn:hover { border-color: var(--blue); }
    .btn-danger { border-color: var(--red); color: var(--red); }
    
    /* Bottom: direction bar */
    .bottombar { display: flex; align-items: center; padding: 8px 16px; background: var(--bg2); border-top: 1px solid var(--border); gap: 12px; font-size: 13px; min-height: 40px; }
    .direction-label { color: var(--text2); }
    .direction-value { color: var(--green); font-weight: 500; }
    .next-steps { margin-left: auto; display: flex; gap: 8px; }
    .next-step-btn { padding: 3px 8px; font-size: 11px; border: 1px solid var(--border); border-radius: 3px; background: transparent; color: var(--text2); cursor: pointer; }
    .next-step-btn:hover { border-color: var(--green); color: var(--green); }

    /* Status colors */
    .st-open { background: var(--yellow); }
    .st-success { background: var(--green); }
    .st-failed { background: var(--red); }
    .st-blocked { background: var(--orange); }
    .st-stale { background: var(--gray); }
    .st-archived { background: var(--gray); }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>🗺️ <span>Agent Atlas</span></h1>
    <input class="search-box" placeholder="Search..." id="search" />
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="open">Active</button>
      <button class="filter-btn" data-filter="blocked">Blocked</button>
      <button class="filter-btn" data-filter="failed">Failed</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="main">
    <div class="tree-panel" id="tree"></div>
    <div class="canvas-panel" id="canvas">
      <div class="canvas-empty" id="canvas-empty">
        <h2>No nodes yet</h2>
        <p>Use MCP tools or the API to create nodes</p>
      </div>
      <svg class="graph-svg" id="graph-svg"></svg>
    </div>
    <div class="detail-panel" id="detail">
      <div class="detail-empty">Select a node to view details</div>
    </div>
  </div>

  <div class="bottombar">
    <span class="direction-label">▶ Direction:</span>
    <span class="direction-value" id="direction">—</span>
    <div class="next-steps" id="next-steps"></div>
  </div>
</div>

<script>
const API = window.location.origin;

const TYPE_ICONS = {
  goal: '🎯', path: '🧭', attempt: '🔧', decision: '✅',
  evidence: '📎', blocker: '⛔', dead_end: '☠️', next_step: '➡️'
};
const STATUS_COLORS = {
  open: 'var(--yellow)', success: 'var(--green)', failed: 'var(--red)',
  blocked: 'var(--orange)', stale: 'var(--gray)', archived: 'var(--gray)'
};
const NODE_COLORS = {
  goal: 'var(--gold)', path: 'var(--blue)', attempt: 'var(--blue)',
  decision: 'var(--purple)', evidence: 'var(--gray)', blocker: 'var(--red)',
  dead_end: 'var(--darkred)', next_step: 'var(--green)'
};

let nodes = [];
let edges = [];
let selectedId = null;
let currentFilter = 'all';

async function load() {
  const [nodesRes, edgesRes] = await Promise.all([
    fetch(`${API}/api/nodes`).then(r => r.json()),
    fetch(`${API}/api/edges`).then(r => r.json()),
  ]);
  nodes = nodesRes;
  edges = edgesRes;
  render();
}

function getChildren(parentId) {
  return nodes.filter(n => n.parentId === parentId);
}

function getRootNodes() {
  return nodes.filter(n => !n.parentId);
}

function render() {
  renderStats();
  renderTree();
  renderGraph();
  renderDetail();
  renderDirection();
}

function renderStats() {
  const goals = nodes.filter(n => n.type === 'goal' && n.status === 'open').length;
  const deadEnds = nodes.filter(n => n.type === 'dead_end' && n.status !== 'archived').length;
  const blockers = nodes.filter(n => n.type === 'blocker' && n.status !== 'archived').length;
  document.getElementById('stats').innerHTML =
    `<span>🎯 ${goals}</span> <span>☠️ ${deadEnds}</span> <span>⛔ ${blockers}</span> <span>📊 ${nodes.length}</span>`;
}

function renderTree() {
  const tree = document.getElementById('tree');
  let html = '';
  
  function nodeMatchesFilter(node) {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'open') return node.status === 'open' || node.status === 'success';
    if (currentFilter === 'blocked') return node.type === 'blocker';
    if (currentFilter === 'failed') return node.status === 'failed' || node.type === 'dead_end';
    return true;
  }

  function hasMatchingDescendant(nodeId) {
    const children = getChildren(nodeId);
    for (const c of children) {
      if (nodeMatchesFilter(c)) return true;
      if (hasMatchingDescendant(c.id)) return true;
    }
    return false;
  }

  function renderNode(node, depth) {
    // Apply filter: show node if it matches OR has matching descendants
    const selfMatch = nodeMatchesFilter(node);
    const descMatch = hasMatchingDescendant(node.id);
    if (!selfMatch && !descMatch) return;
    
    const icon = TYPE_ICONS[node.type] || '•';
    const selected = node.id === selectedId ? ' selected' : '';
    const opacity = (node.status === 'archived' || node.status === 'stale') ? 'opacity:0.4;' : '';
    const dotColor = STATUS_COLORS[node.status] || 'var(--gray)';
    
    html += `<div class="tree-node${selected}" style="${opacity}" onclick="selectNode('${node.id}')">`;
    for (let i = 0; i < depth; i++) html += '<span class="tree-indent"></span>';
    html += `<span class="icon">${icon}</span>`;
    html += `<span class="title">${esc(node.title)}</span>`;
    html += `<span class="dot" style="background:${dotColor}"></span>`;
    html += '</div>';
    
    const children = getChildren(node.id);
    children.forEach(c => renderNode(c, depth + 1));
  }
  
  getRootNodes().forEach(n => renderNode(n, 0));
  // Also render orphan nodes (no parent but not root type)
  tree.innerHTML = html || '<div style="padding:12px;color:var(--text2);font-size:13px">No nodes</div>';
}

function renderGraph() {
  const svg = document.getElementById('graph-svg');
  const empty = document.getElementById('canvas-empty');
  
  // Filter nodes for graph
  const filteredNodes = currentFilter === 'all' ? nodes : nodes.filter(n => nodeMatchesFilter(n));
  
  if (filteredNodes.length === 0) {
    empty.style.display = '';
    svg.innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  // Simple tree layout
  const W = 160, H = 60, GAP_X = 30, GAP_Y = 80;
  const positions = {};
  
  function layout(nodeId, x, y, availableWidth) {
    positions[nodeId] = { x: x + availableWidth / 2 - W / 2, y };
    const children = getChildren(nodeId);
    if (children.length === 0) return;
    const childWidth = (availableWidth - GAP_X * (children.length - 1)) / children.length;
    children.forEach((c, i) => {
      layout(c.id, x + i * (childWidth + GAP_X), y + H + GAP_Y, childWidth);
    });
  }
  
  const roots = getRootNodes().filter(n => nodeMatchesFilter(n) || hasMatchingDescendant(n.id));
  const totalWidth = Math.max(roots.length * (W + GAP_X), 600);
  roots.forEach((r, i) => {
    layout(r.id, i * (totalWidth / roots.length), 20, totalWidth / roots.length);
  });
  
  // Render SVG
  let svgHtml = '';
  
  // Edges
  edges.forEach(e => {
    if (!positions[e.fromId] || !positions[e.toId]) return;
    const from = positions[e.fromId];
    const to = positions[e.toId];
    const x1 = from.x + W / 2, y1 = from.y + H;
    const x2 = to.x + W / 2, y2 = to.y;
    svgHtml += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--border)" stroke-width="1.5"/>`;
  });
  
  // Parent-child lines (from contains edges or parentId)
  nodes.forEach(n => {
    if (!n.parentId || !positions[n.parentId] || !positions[n.id]) return;
    const from = positions[n.parentId];
    const to = positions[n.id];
    const x1 = from.x + W / 2, y1 = from.y + H;
    const x2 = to.x + W / 2, y2 = to.y;
    svgHtml += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--border)" stroke-width="1"/>`;
  });
  
  // Nodes
  nodes.forEach(n => {
    if (!positions[n.id]) return;
    const pos = positions[n.id];
    const color = NODE_COLORS[n.type] || 'var(--blue)';
    const filterMatch = nodeMatchesFilter(n);
    const opacity = (!filterMatch || n.status === 'archived' || n.status === 'stale') ? 0.25 : 1;
    const icon = TYPE_ICONS[n.type] || '•';
    const sel = n.id === selectedId;
    
    svgHtml += `<g class="graph-node" onclick="selectNode('${n.id}')" style="opacity:${opacity}">`;
    svgHtml += `<rect x="${pos.x}" y="${pos.y}" width="${W}" height="${H}" fill="var(--bg2)" stroke="${sel ? 'var(--blue)' : color}" stroke-width="${sel ? 2 : 1}" rx="6"/>`;
    svgHtml += `<text x="${pos.x + 10}" y="${pos.y + 22}" font-size="14">${icon}</text>`;
    svgHtml += `<text x="${pos.x + 28}" y="${pos.y + 22}" font-size="12" fill="var(--text)">${esc(n.title.slice(0, 16))}</text>`;
    svgHtml += `<text x="${pos.x + 10}" y="${pos.y + 42}" font-size="10" fill="var(--text2)">${n.status}</text>`;
    svgHtml += `<circle cx="${pos.x + W - 10}" cy="${pos.y + 10}" r="4" fill="${STATUS_COLORS[n.status] || 'var(--gray)'}"/>`;
    svgHtml += '</g>';
  });
  
  svg.innerHTML = svgHtml;
  
  // Auto-size SVG
  const allPos = Object.values(positions);
  if (allPos.length > 0) {
    const maxX = Math.max(...allPos.map(p => p.x)) + W + 40;
    const maxY = Math.max(...allPos.map(p => p.y)) + H + 40;
    svg.setAttribute('viewBox', `0 0 ${maxX} ${maxY}`);
  }
}

function renderDetail() {
  const el = document.getElementById('detail');
  if (!selectedId) {
    el.innerHTML = '<div class="detail-empty">Select a node to view details</div>';
    return;
  }
  
  const node = nodes.find(n => n.id === selectedId);
  if (!node) {
    el.innerHTML = '<div class="detail-empty">Node not found</div>';
    return;
  }
  
  const icon = TYPE_ICONS[node.type] || '•';
  const statusColor = STATUS_COLORS[node.status] || 'var(--gray)';
  const children = getChildren(node.id);
  const parent = node.parentId ? nodes.find(n => n.id === node.parentId) : null;
  const relatedEdges = edges.filter(e => e.fromId === node.id || e.toId === node.id);
  
  let html = '';
  html += `<div class="detail-type">${icon} ${node.type}</div>`;
  html += `<div class="detail-title">${esc(node.title)}</div>`;
  html += `<div class="detail-status st-${node.status}">${node.status}</div>`;
  
  if (node.scope && node.scope !== 'global') {
    html += `<div style="margin-top:8px;font-size:12px;color:var(--cyan)">📍 ${esc(node.scope)}</div>`;
  }
  
  if (node.summary) {
    html += `<div class="detail-section"><h4>Summary</h4><p>${esc(node.summary)}</p></div>`;
  }
  
  if (node.tags && node.tags.length > 0) {
    html += `<div class="detail-section"><h4>Tags</h4><p>${node.tags.map(t => `<span style="background:var(--bg3);padding:2px 6px;border-radius:3px;font-size:11px">#${t}</span>`).join(' ')}</p></div>`;
  }
  
  if (parent) {
    html += `<div class="detail-section"><h4>Parent</h4><p>${TYPE_ICONS[parent.type]} ${esc(parent.title)}</p></div>`;
  }
  
  if (children.length > 0) {
    html += `<div class="detail-section"><h4>Children (${children.length})</h4>`;
    children.forEach(c => {
      html += `<p style="font-size:12px">${TYPE_ICONS[c.type]} ${esc(c.title)} <span class="dot st-${c.status}" style="display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:middle"></span></p>`;
    });
    html += '</div>';
  }
  
  html += `<div class="detail-section"><h4>Meta</h4>`;
  html += `<p style="font-size:12px;color:var(--text2)">Created: ${new Date(node.createdAt).toLocaleString()}</p>`;
  html += `<p style="font-size:12px;color:var(--text2)">Updated: ${new Date(node.updatedAt).toLocaleString()}</p>`;
  if (node.agentName) html += `<p style="font-size:12px;color:var(--text2)">Agent: ${esc(node.agentName)}</p>`;
  html += '</div>';
  
  html += `<div class="detail-actions">`;
  html += `<button class="btn" onclick="editNode('${node.id}')">Edit</button>`;
  if (node.type === 'path') html += `<button class="btn btn-danger" onclick="markDeadEnd('${node.id}')">Mark Dead End</button>`;
  html += `<button class="btn" onclick="archiveNode('${node.id}')">Archive</button>`;
  html += `<button class="btn btn-danger" onclick="deleteNode('${node.id}')">Delete</button>`;
  html += '</div>';
  
  el.innerHTML = html;
}

function renderDirection() {
  const nextSteps = nodes.filter(n => n.type === 'next_step' && n.status === 'open');
  const dir = document.getElementById('direction');
  const steps = document.getElementById('next-steps');
  
  if (nextSteps.length > 0) {
    dir.textContent = nextSteps[0].title;
    steps.innerHTML = nextSteps.slice(1).map(ns =>
      `<button class="next-step-btn">${esc(ns.title)}</button>`
    ).join('');
  } else {
    dir.textContent = '—';
    steps.innerHTML = '';
  }
}

// Actions
window.selectNode = function(id) {
  selectedId = id;
  render();
};

window.editNode = async function(id) {
  const node = nodes.find(n => n.id === id);
  if (!node) return;
  const newTitle = prompt('Title:', node.title);
  if (newTitle === null) return;
  const newSummary = prompt('Summary:', node.summary || '');
  await fetch(`${API}/api/nodes/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: newTitle, summary: newSummary || undefined }),
  });
  await load();
};

window.markDeadEnd = async function(id) {
  if (!confirm('Mark this as a dead end?')) return;
  await fetch(`${API}/api/nodes/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'failed' }),
  });
  // Create dead_end child
  const node = nodes.find(n => n.id === id);
  await fetch(`${API}/api/nodes`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: 'dead_end', title: `Dead end: ${node?.title}`, parentId: id, status: 'failed' }),
  });
  await load();
};

window.archiveNode = async function(id) {
  await fetch(`${API}/api/nodes/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'archived' }),
  });
  await load();
};

window.deleteNode = async function(id) {
  if (!confirm('Delete this node?')) return;
  await fetch(`${API}/api/nodes/${id}`, { method: 'DELETE' });
  selectedId = null;
  await load();
};

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

// Search
document.getElementById('search').addEventListener('input', async (e) => {
  const q = e.target.value.trim();
  if (!q) { await load(); return; }
  const results = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`).then(r => r.json());
  nodes = results;
  render();
});

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Auto-refresh
setInterval(load, 3000);
load();
</script>
</body>
</html>
